apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Development overlay - uses base without operator image replacement
# This allows 'kustomize edit set image' to work for local development and CI
# Override namespace to use parameterized value instead of hardcoded 'opendatahub'
namespace: $NAMESPACE

resources:
  - ../../../../config/base

patches:
  - path: manager-rolebinding-patch.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: mlflow-operator-manager-rolebinding
  - path: metrics-auth-rolebinding-patch.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: mlflow-operator-metrics-auth-rolebinding
  - path: manager-patch.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: mlflow-operator-controller-manager

# Base replacements bake config/base/params.env into the Deployment before this
# overlay replaces the ConfigMap. Re-apply image and env values from Kind's
# params.env so overrides such as --mlflow-url actually reach the operator.
replacements:
- source:
    kind: ConfigMap
    name: operator-params
    fieldPath: data.MLFLOW_OPERATOR_IMAGE
  targets:
  - select:
      kind: Deployment
      name: mlflow-operator-controller-manager
    fieldPaths:
    - spec.template.spec.containers.[name=manager].image
- source:
    kind: ConfigMap
    name: operator-params
    fieldPath: data.MLFLOW_IMAGE
  targets:
  - select:
      kind: Deployment
      name: mlflow-operator-controller-manager
    fieldPaths:
    - spec.template.spec.containers.[name=manager].env.[name=MLFLOW_IMAGE].value
- source:
    kind: ConfigMap
    name: operator-params
    fieldPath: data.gateway-name
  targets:
  - select:
      kind: Deployment
      name: mlflow-operator-controller-manager
    fieldPaths:
    - spec.template.spec.containers.[name=manager].env.[name=GATEWAY_NAME].value
- source:
    kind: ConfigMap
    name: operator-params
    fieldPath: data.mlflow-url
  targets:
  - select:
      kind: Deployment
      name: mlflow-operator-controller-manager
    fieldPaths:
    - spec.template.spec.containers.[name=manager].env.[name=MLFLOW_URL].value
- source:
    kind: ConfigMap
    name: operator-params
    fieldPath: data.section-title
  targets:
  - select:
      kind: Deployment
      name: mlflow-operator-controller-manager
    fieldPaths:
    - spec.template.spec.containers.[name=manager].env.[name=SECTION_TITLE].value


# Override operator params with kind-specific values
configMapGenerator:
- name: operator-params
  envs:
  - params.env
  behavior: replace

# Generate TLS secret using pre-generated certificate files
secretGenerator:
- name: mlflow-tls
  type: kubernetes.io/tls
  files:
  - tls.crt
  - tls.key
  options:
    disableNameSuffixHash: true
- name: mlflow-artifacts-tls
  type: kubernetes.io/tls
  files:
  - tls.crt
  - tls.key
  options:
    disableNameSuffixHash: true
